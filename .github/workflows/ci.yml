name: CI

on:
  push:
    branches: [main, 'audit/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Stdlib-only unittest suite (4 files, 56 tests). No pip installs,
      # no secrets, no network. Failure exits nonzero and fails the job.
      - name: Run test suite
        run: python -m unittest discover -s tests -v
